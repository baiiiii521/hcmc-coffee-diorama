<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   1. RENDERER / SCENE / CAMERA
   ============================================================ */
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.02;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x16110e);

const camera = new THREE.PerspectiveCamera(35, window.innerWidth / window.innerHeight, 0.5, 400);
camera.position.set(41, 36, 47);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-1.0, 2.4, -0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.rotateSpeed = 0.8;
controls.zoomSpeed = 0.9;
controls.panSpeed = 0.7;
controls.screenSpacePanning = true;
controls.minDistance = 26;
controls.maxDistance = 125;
controls.minPolarAngle = THREE.MathUtils.degToRad(14);
controls.maxPolarAngle = THREE.MathUtils.degToRad(78);
controls.update();

/* ============================================================
   2. LIGHTS — golden hour
   ============================================================ */
const hemi = new THREE.HemisphereLight(0xffe2bc, 0x4a3428, 0.55);
scene.add(hemi);

scene.add(new THREE.AmbientLight(0xffdcb4, 0.22));

const sun = new THREE.DirectionalLight(0xffb877, 2.55);
sun.position.set(27, 31, 35);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -30;
sun.shadow.camera.right = 30;
sun.shadow.camera.top = 30;
sun.shadow.camera.bottom = -30;
sun.shadow.camera.near = 4;
sun.shadow.camera.far = 130;
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.035;
sun.shadow.radius = 2;
scene.add(sun);
sun.target.position.set(-2, 2, -1);
scene.add(sun.target);

const fill = new THREE.DirectionalLight(0x93b5dd, 0.42);
fill.position.set(-30, 17, -28);
scene.add(fill);

/* ============================================================
   3. SMALL UTILITIES
   ============================================================ */
function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const R = mulberry32(20261103);
const clamp01 = (v) => (v < 0 ? 0 : v > 1 ? 1 : v);
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
function easeOutBack(t) {
  const c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}

const G = (x = 0, y = 0, z = 0, parent = null) => {
  const g = new THREE.Group();
  g.position.set(x, y, z);
  if (parent) parent.add(g);
  return g;
};

function B(parent, w, h, d, m, x, y, z, ry = 0, rx = 0, rz = 0, cast = true) {
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), m);
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, rz);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function CY(parent, rt, rb, h, m, x, y, z, seg = 16, cast = true) {
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function SPH(parent, r, m, x, y, z, seg = 14, cast = true) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(r, seg, Math.max(8, seg - 2)), m);
  mesh.position.set(x, y, z);
  mesh.castShadow = cast;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

const _v1 = new THREE.Vector3();
const _v2 = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);
function rod(parent, a, b, r, m, seg = 8) {
  const A = _v1.set(a[0], a[1], a[2]);
  const Bv = _v2.set(b[0], b[1], b[2]);
  const dir = new THREE.Vector3().subVectors(Bv, A);
  const len = dir.length();
  if (len < 1e-5) return null;
  const mesh = new THREE.Mesh(new THREE.CylinderGeometry(r, r, len, seg), m);
  mesh.position.copy(A).add(Bv).multiplyScalar(0.5);
  mesh.quaternion.setFromUnitVectors(UP, dir.normalize());
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

function textPlane(parent, w, h, tex, x, y, z, ry = 0, rx = 0) {
  const mesh = new THREE.Mesh(
    new THREE.PlaneGeometry(w, h),
    new THREE.MeshStandardMaterial({ map: tex, roughness: 0.82, metalness: 0.02 })
  );
  mesh.position.set(x, y, z);
  mesh.rotation.set(rx, ry, 0);
  mesh.castShadow = false;
  mesh.receiveShadow = true;
  parent.add(mesh);
  return mesh;
}

/* ============================================================
   4. TIMELINE (assembly animation)
   ============================================================ */
const ANIMS = [];
function anim(obj, delay, opts = {}) {
  obj.visible = false;
  ANIMS.push({
    obj,
    delay,
    dur: opts.dur !== undefined ? opts.dur : 1.0,
    mode: opts.mode || 'rise',
    dy: opts.dy !== undefined ? opts.dy : 4,
    dx: opts.dx !== undefined ? opts.dx : 0,
    dz: opts.dz !== undefined ? opts.dz : 0,
    base: obj.position.clone(),
    baseScale: obj.scale.clone(),
    done: false
  });
  return obj;
}

function updateAnims(t) {
  for (let i = 0; i < ANIMS.length; i++) {
    const a = ANIMS[i];
    if (a.done) continue;
    const raw = (t - a.delay) / a.dur;
    if (raw <= 0) continue;
    a.obj.visible = true;
    const p = raw >= 1 ? 1 : raw;
    const e = (a.mode === 'slide' || a.mode === 'unroll') ? easeOutCubic(p) : easeOutBack(p);
    const inv = 1 - e;
    if (a.mode === 'rise') {
      a.obj.position.y = a.base.y - a.dy * inv;
    } else if (a.mode === 'drop') {
      a.obj.position.y = a.base.y + a.dy * inv;
    } else if (a.mode === 'slide') {
      a.obj.position.x = a.base.x + a.dx * inv;
      a.obj.position.z = a.base.z + a.dz * inv;
    } else if (a.mode === 'unroll') {
      const s = Math.max(e, 0.001);
      a.obj.scale.set(a.baseScale.x * s, a.baseScale.y, a.baseScale.z * s);
    } else if (a.mode === 'grow') {
      a.obj.scale.setScalar(Math.max(e, 0.001));
    }
    if (p >= 1) {
      a.obj.position.set(a.base.x, a.base.y, a.base.z);
      a.obj.scale.copy(a.baseScale);
      a.done = true;
    }
  }
}

/* ============================================================
   5. CANVAS TEXTURES
   ============================================================ */
function canvasTex(w, h, draw, repeatX = 1, repeatY = 1) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d');
  draw(ctx, w, h);
  const tex = new THREE.CanvasTexture(c);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  if (repeatX !== 1 || repeatY !== 1) {
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(repeatX, repeatY);
  }
  return tex;
}

function fitText(ctx, text, maxW, startSize, weight, family) {
  let size = startSize;
  ctx.font = weight + ' ' + size + 'px ' + family;
  while (ctx.measureText(text).width > maxW && size > 8) {
    size -= 2;
    ctx.font = weight + ' ' + size + 'px ' + family;
  }
  return size;
}

function grain(ctx, w, h, n, alpha) {
  for (let i = 0; i < n; i++) {
    const v = Math.floor(R() * 70);
    ctx.fillStyle = 'rgba(' + v + ',' + v + ',' + v + ',' + (alpha * (0.3 + R())) + ')';
    ctx.fillRect(R() * w, R() * h, R() * 2.2 + 0.4, R() * 2.2 + 0.4);
  }
}

/* round letterpress-style board */
function boardTex(o) {
  const W = o.w || 1024, H = o.h || 256;
  const font = o.font || '"Georgia", "Times New Roman", serif';
  return canvasTex(W, H, (ctx, w, h) => {
    ctx.fillStyle = o.bg || '#173a2b';
    ctx.fillRect(0, 0, w, h);
    const g = ctx.createLinearGradient(0, 0, 0, h);
    g.addColorStop(0, 'rgba(255,255,255,0.10)');
    g.addColorStop(0.45, 'rgba(255,255,255,0.0)');
    g.addColorStop(1, 'rgba(0,0,0,0.24)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, w, h);
    if (o.border !== false) {
      ctx.strokeStyle = o.borderColor || o.fg || '#f2dfae';
      ctx.lineWidth = Math.max(4, H * 0.028);
      const pad = H * 0.055;
      ctx.strokeRect(pad, pad, w - pad * 2, h - pad * 2);
    }
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = o.fg || '#f2dfae';
    const maxW = w * 0.88;
    const mainSize = Math.round(H * (o.textSize || 0.5));
    fitText(ctx, o.text || '', maxW, mainSize, '700', font);
    if (o.sub) {
      ctx.fillText(o.text, w / 2, h * 0.41);
      const subSize = Math.round(H * (o.subSize || 0.13));
      fitText(ctx, o.sub, maxW, subSize, '500', font);
      ctx.globalAlpha = 0.82;
      ctx.fillText(o.sub, w / 2, h * 0.775);
      ctx.globalAlpha = 1;
    } else {
      ctx.fillText(o.text || '', w / 2, h * 0.53);
    }
    grain(ctx, w, h, 240, 0.05);
  });
}

const texSidewalk = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#a9a59a';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 2; i++) {
    for (let j = 0; j < 2; j++) {
      ctx.fillStyle = (i + j) % 2 === 0 ? '#b0aca1' : '#a29e93';
      ctx.fillRect(i * w / 2 + 1, j * h / 2 + 1, w / 2 - 2, h / 2 - 2);
    }
  }
  ctx.strokeStyle = 'rgba(120,116,106,0.85)';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(w / 2, 0); ctx.lineTo(w / 2, h);
  ctx.moveTo(0, h / 2); ctx.lineTo(w, h / 2);
  ctx.moveTo(0, 1); ctx.lineTo(w, 1);
  ctx.moveTo(1, 0); ctx.lineTo(1, h);
  ctx.stroke();
  for (let i = 0; i < 120; i++) {
    ctx.fillStyle = 'rgba(70,66,60,' + (0.03 + R() * 0.06) + ')';
    ctx.beginPath();
    ctx.arc(R() * w, R() * h, R() * 5 + 1, 0, Math.PI * 2);
    ctx.fill();
  }
}, 16, 10);

const texAsphalt = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#41423d';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 3200; i++) {
    const v = 55 + Math.floor(R() * 45);
    ctx.fillStyle = 'rgba(' + v + ',' + v + ',' + (v - 4) + ',' + (0.15 + R() * 0.4) + ')';
    ctx.fillRect(R() * w, R() * h, R() * 2 + 0.5, R() * 2 + 0.5);
  }
  ctx.strokeStyle = 'rgba(28,28,26,0.55)';
  for (let i = 0; i < 5; i++) {
    ctx.lineWidth = 0.8 + R();
    ctx.beginPath();
    let x = R() * w, y = R() * h;
    ctx.moveTo(x, y);
    for (let k = 0; k < 5; k++) {
      x += (R() - 0.5) * 46;
      y += (R() - 0.5) * 46;
      ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
}, 9, 3);

function plasterTex(base, tint) {
  return canvasTex(256, 256, (ctx, w, h) => {
    ctx.fillStyle = base;
    ctx.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++) {
      ctx.fillStyle = 'rgba(' + tint + ',' + (0.02 + R() * 0.05) + ')';
      ctx.beginPath();
      ctx.arc(R() * w, R() * h, R() * 2.6 + 0.4, 0, Math.PI * 2);
      ctx.fill();
    }
    for (let i = 0; i < 26; i++) {
      const x = R() * w;
      const len = h * (0.15 + R() * 0.85);
      const g = ctx.createLinearGradient(0, h - len, 0, h);
      g.addColorStop(0, 'rgba(80,58,36,0)');
      g.addColorStop(1, 'rgba(72,52,32,0.13)');
      ctx.fillStyle = g;
      ctx.fillRect(x, h - len, 1 + R() * 5, len);
    }
    grain(ctx, w, h, 500, 0.05);
  }, 2, 1);
}
const texWallCream = plasterTex('#e3cf9f', '90,70,42');
const texWallYellow = plasterTex('#dcb264', '96,66,28');
const texWallPink = plasterTex('#d9a58b', '104,64,46');
const texWallMint = plasterTex('#b9c9ae', '60,80,52');

const texFloorTile = canvasTex(256, 256, (ctx, w, h) => {
  for (let i = 0; i < 2; i++) {
    for (let j = 0; j < 2; j++) {
      const odd = (i + j) % 2 === 0;
      ctx.fillStyle = odd ? '#b9704a' : '#a9613e';
      ctx.fillRect(i * w / 2, j * h / 2, w / 2, h / 2);
      ctx.strokeStyle = 'rgba(90,55,38,0.5)';
      ctx.lineWidth = 4;
      ctx.strokeRect(i * w / 2, j * h / 2, w / 2, h / 2);
    }
  }
  for (let i = 0; i < 400; i++) {
    ctx.fillStyle = 'rgba(60,36,24,' + (0.04 + R() * 0.07) + ')';
    ctx.beginPath();
    ctx.arc(R() * w, R() * h, R() * 4 + 1, 0, Math.PI * 2);
    ctx.fill();
  }
}, 5, 4);

const texWood = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#7d4d2b';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 70; i++) {
    ctx.strokeStyle = 'rgba(' + (38 + Math.floor(R() * 40)) + ',' + (20 + Math.floor(R() * 22)) + ',' + (8 + Math.floor(R() * 12)) + ',' + (0.12 + R() * 0.24) + ')';
    ctx.lineWidth = 0.6 + R() * 2.2;
    ctx.beginPath();
    const y = R() * h;
    ctx.moveTo(0, y);
    ctx.bezierCurveTo(w * 0.3, y + (R() - 0.5) * 20, w * 0.7, y + (R() - 0.5) * 20, w, y + (R() - 0.5) * 8);
    ctx.stroke();
  }
}, 2, 2);

const texShutter = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#38634a';
  ctx.fillRect(0, 0, w, h);
  for (let y = 4; y < h; y += 13) {

    ctx.fillRect(0, y + 4, w, 2);

  ctx.strokeRect(7, 7, w - 14, h - 14);

const texShutterMetal = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#8e877a';

  for (let y = 0; y < h; y += 16) {

const texAwning = canvasTex(768, 128, (ctx, w, h) => {
  const n = 12;
  for (let i = 0; i < n; i++) {
    ctx.fillStyle = i % 2 === 0 ? '#2f5d46' : '#e9dbb4';

  g.addColorStop(0, 'rgba(255,255,255,0.18)');
  g.addColorStop(1, 'rgba(0,0,0,0.24)');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  grain(ctx, w, h, 260, 0.07);
});

const texRoof = canvasTex(256, 256, (ctx, w, h) => {
  ctx.fillStyle = '#8a5f45';
  ctx.fillRect(0, 0, w, h);
  for (let x = 0; x < w; x += 16) {
    const g = ctx.createLinearGradient(x, 0, x + 16, 0);
    g.addColorStop(0, 'rgba(0,0,0,0.30)');
    g.addColorStop(0.5, 'rgba(255,255,255,0.16)');
    g.addColorStop(1, 'rgba(0,0,0,0.30)');
    ctx.fillStyle = g;
    ctx.fillRect(x, 0, 16, h);

    ctx.beginPath();
    ctx.arc(R() * w, R() * h, R() * 16 + 3, 0, Math.PI * 2);
    ctx.fill();
  }
}, 4, 1);

const texSignMain = boardTex({

});

const texMenuBoard = canvasTex(512, 660, (ctx, w, h) => {
  ctx.fillStyle = '#1d2a24';
  ctx.fillRect(0, 0, w, h);
  for (let i = 0; i < 700; i++) {

function posterTex(title, sub, bg, fg, accent) {
  return canvasTex(256, 384, (ctx, w, h) => {
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = accent;
    ctx.fillRect(0, 0, w, 74);
    ctx.fillStyle = bg;
    ctx.fillRect(14, 86, w - 28, 2);
    ctx.fillStyle = fg;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.font = '700 30px "Georgia", serif';
    const lines = title.split('|');
    lines.forEach((ln, i) => ctx.fillText(ln, w / 2, 150 + i * 40));
    ctx.font = 'italic 19px "Georgia", serif';
    const sl = sub.split('|');
    sl.forEach((ln, i) => ctx.fillText(ln, w / 2, 264 + i * 28));
    ctx.strokeStyle = 'rgba(0,0,0,0.25)';
    ctx.lineWidth = 6;
    ctx.strokeRect(3, 3, w - 6, h - 6);
    grain(ctx, w, h, 500, 0.11);
  });
}

function addWindow(parent, x, y, z, w, h, opts) {
  const o = opts || {};
  const g = G(x, y, z, parent);
  if (o.ry) g.rotation.y = o.ry;
  B(g, w, h, 0.06, M.darkInside, 0, 0, 0, 0, 0, 0, false);
  B(g, w - 0.14, h - 0.14, 0.03, o.lit ? M.windowLit : M.glass, 0, 0, 0.04, 0, 0, 0, false);
  B(g, 0.05, h - 0.1, 0.08, M.greenFrame, 0, 0, 0.06);
  B(g, w - 0.1, 0.05, 0.08, M.greenFrame, 0, 0.12, 0.06);
  B(g, w + 0.14, 0.1, 0.16, M.creamTrim, 0, h / 2 + 0.04, 0.05);
  B(g, w + 0.14, 0.1, 0.16, M.creamTrim, 0, -h / 2 - 0.04, 0.05);
  B(g, 0.1, h + 0.18, 0.16, M.creamTrim, -w / 2 - 0.04, 0, 0.05);
  B(g, 0.1, h + 0.18, 0.16, M.creamTrim, w / 2 + 0.04, 0, 0.05);
  B(g, w + 0.36, 0.09, 0.28, M.stone, 0, -h / 2 - 0.12, 0.12);
  if (o.shutters !== false) {
    const sw = w * 0.48;
    for (const s of [-1, 1]) {
      B(g, sw, h, 0.05, M.shutter, s * (w / 2 + sw / 2 + 0.05), 0, 0.075);
    }
  }
  return g;
}

function addBalcony(parent, x, y, z, w, opts) {
  const o = opts || {};
  const d = o.d || 1.0;
  const rh = o.rh || 0.82;
  const g = G(x, y, z, parent);
  B(g, w, 0.14, d, M.stone, 0, 0, d / 2);
  B(g, w + 0.16, 0.1, 0.12, M.creamTrim, 0, 0.04, d + 0.02);
  const n = Math.max(4, Math.round(w / 0.26));
  for (let i = 0; i <= n; i++) {
    rod(g, [-w / 2 + (w / n) * i, 0.06, d], [-w / 2 + (w / n) * i, rh, d], 0.018, M.ironDark, 5);
  }
  B(g, w, 0.06, 0.06, M.ironDark, 0, rh, d);
  B(g, w, 0.04, 0.04, M.ironDark, 0, 0.28, d);
  for (const s of [-1, 1]) {
    B(g, 0.05, 0.05, d, M.ironDark, s * w / 2, rh, d / 2);
    B(g, 0.05, 0.05, d, M.ironDark, s * w / 2, 0.28, d / 2);
    const k = Math.max(2, Math.round(d / 0.26));
    for (let i = 0; i <= k; i++) {
      rod(g, [s * w / 2, 0.06, (d / k) * i], [s * w / 2, rh, (d / k) * i], 0.016, M.ironDark, 5);
    }
  }
  return g;
}

function makeChair(woodMat) {

  B(g, 0.46, 0.06, 0.46, woodMat, 0, 0.46, 0);
  for (const sx of [-1, 1]) {

function makePendant(parent, x, yTop, z, cordLen) {
  const g = G(x, yTop, z, parent);
  rod(g, [0, 0, 0], [0, -cordLen, 0], 0.012, M.black, 5);
  const shade = new THREE.Mesh(new THREE.CylinderGeometry(0.13, 0.34, 0.32, 18, 1, true), M.lampShade);
  shade.position.set(0, -cordLen - 0.06, 0);
  shade.castShadow = true;
  g.add(shade);
  CY(g, 0.3, 0.3, 0.02, M.brass, 0, -cordLen - 0.22, 0, 18, false);
  SPH(g, 0.09, M.bulb, 0, -cordLen - 0.18, 0, 10, false);
  const pl = new THREE.PointLight(0xffab5a, 6.5, 14, 2);
  pl.position.set(0, -cordLen - 0.28, 0);
  g.add(pl);
  return g;
}

function makeWire(p1, p2, sag, r) {
  const g = new THREE.Group();
  g.position.set(p1[0], p1[1], p1[2]);
  const end = new THREE.Vector3(p2[0] - p1[0], p2[1] - p1[1], p2[2] - p1[2]);
  const mid = end.clone().multiplyScalar(0.5);
  mid.y -= sag;
  const curve = new THREE.CatmullRomCurve3([new THREE.Vector3(0, 0, 0), mid, end]);
  const mesh = new THREE.Mesh(new THREE.TubeGeometry(curve, 22, r || 0.032, 5, false), M.wire);
  mesh.castShadow = true;
  g.add(mesh);
  return g;
}

function leafGeo(len, wid, holes) {
  const s = new THREE.Shape();
  s.moveTo(0, 0);
  s.bezierCurveTo(wid * 0.95, len * 0.16, wid * 1.05, len * 0.62, 0, len);
  s.bezierCurveTo(-wid * 1.05, len * 0.62, -wid * 0.95, len * 0.16, 0, 0);
  for (let i = 0; i < holes; i++) {
    const h = new THREE.Path();
    const sx = (i % 2 === 0 ? 1 : -1) * wid * 0.3;
    const sy = len * (0.44 + 0.16 * Math.floor(i / 2));
    h.absellipse(sx, sy, wid * 0.12, len * 0.042, 0, Math.PI * 2, false, 0);
    s.holes.push(h);
  }
  return new THREE.ExtrudeGeometry(s, { depth: 0.02, bevelEnabled: false, curveSegments: 6 });
}

function makeMonstera(scale) {
  const s = scale || 1;
  const g = new THREE.Group();
  CY(g, 0.4 * s, 0.3 * s, 0.55 * s, M.terracotta, 0, 0.275 * s, 0, 14);
  CY(g, 0.36 * s, 0.36 * s, 0.04 * s, M.soil, 0, 0.55 * s, 0, 14, false);
  const n = 8;
  for (let i = 0; i < n; i++) {
    const phi = (i / n) * Math.PI * 2 + R() * 0.35;
    const reach = (0.75 + R() * 0.55) * s;
    const tip = [Math.sin(phi) * reach, (1.1 + R() * 0.75) * s, Math.cos(phi) * reach];
    const midPt = [Math.sin(phi) * reach * 0.32, (0.72 + R() * 0.3) * s, Math.cos(phi) * reach * 0.32];
    rod(g, [0, 0.52 * s, 0], midPt, 0.024 * s, M.greenDark, 5);
    rod(g, midPt, tip, 0.018 * s, M.greenDark, 5);
    const leaf = new THREE.Mesh(leafGeo((0.6 + R() * 0.22) * s, (0.3 + R() * 0.08) * s, 4), R() > 0.5 ? M.leafMid : M.leafDark);
    leaf.position.set(tip[0], tip[1], tip[2]);
    leaf.rotation.order = 'YXZ';
    leaf.rotation.y = phi;
    leaf.rotation.x = 1.15 + R() * 0.45;
    leaf.castShadow = true;
    g.add(leaf);
  }
  return g;
}

function makePalm(scale) {
  const s = scale || 1;
  const g = new THREE.Group();
  CY(g, 0.42 * s, 0.34 * s, 0.35 * s, M.stone, 0, 0.175 * s, 0, 12);
  CY(g, 0.36 * s, 0.36 * s, 0.05 * s, M.soil, 0, 0.34 * s, 0, 12, false);
  let px = 0;
  let pz = 0;
  const segs = 7;
  for (let i = 0; i < segs; i++) {
    const y0 = 0.34 * s + i * 0.52 * s;
    const nx = px + Math.sin(i * 0.6) * 0.07 * s;
    const nz = pz + Math.cos(i * 0.4) * 0.03 * s;
    rod(g, [px, y0, pz], [nx, y0 + 0.52 * s, nz], (0.15 - i * 0.012) * s, M.woodLight, 7);
    px = nx; pz = nz;
  }
  const topY = 0.34 * s + segs * 0.52 * s;
  for (let i = 0; i < 9; i++) {
    const phi = (i / 9) * Math.PI * 2 + R() * 0.25;
    const leaf = new THREE.Mesh(leafGeo(1.25 * s, 0.15 * s, 0), M.leafPalm);
    leaf.position.set(px, topY, pz);
    leaf.rotation.order = 'YXZ';
    leaf.rotation.y = phi;
    leaf.rotation.x = 1.45 + R() * 0.25;
    leaf.castShadow = true;
    g.add(leaf);
  }
  SPH(g, 0.12 * s, std(0x6b5a2a, { roughness: 0.9 }), px, topY - 0.1, pz, 8, false);
  return g;
}

function makePothos() {
  const g = new THREE.Group();
  CY(g, 0.22, 0.16, 0.26, M.terracotta, 0, 0.13, 0, 12);
  for (let v = 0; v < 3; v++) {
    const phi = v * 2.1 + R();
    const dx = Math.sin(phi) * 0.4;
    const dz = Math.cos(phi) * 0.4;
    const pts = [];
    for (let k = 0; k < 4; k++) {
      pts.push([dx * k * 0.5, 0.3 - k * 0.34 - R() * 0.06, dz * k * 0.5]);
    }
    for (let k = 0; k < pts.length - 1; k++) rod(g, pts[k], pts[k + 1], 0.012, M.greenDark, 4);
    for (let k = 1; k < pts.length; k++) {
      const leaf = new THREE.Mesh(leafGeo(0.2, 0.1, 0), M.leafLight);
      leaf.position.set(pts[k][0], pts[k][1], pts[k][2]);
      leaf.rotation.order = 'YXZ';
      leaf.rotation.y = phi + k * 0.8;
      leaf.rotation.x = 1.3;
      g.add(leaf);
    }
  }
  return g;
}

    SPH(g, 0.05, skinM, s * 0.215, handY - 0.01, handZ, 8, false);
    rod(g, [s * 0.105, hipY, 0], [s * 0.11, kneeY, kneeZ], 0.075, pantsM, 7);
    rod(g, [s * 0.11, kneeY, kneeZ], [s * 0.12, footY, footZ], 0.056, pantsM, 7);
    B(g, 0.145, 0.075, 0.235, M.black, s * 0.12, footY + 0.018, footZ + 0.04);
  }
  if (o.apron) {
    B(g, 0.3, 0.52, 0.025, std(0x4a3524, { roughness: 0.9 }), 0, hipY + 0.3, 0.16);
  }
  if (o.hat === 'nonla') {
    const hat = new THREE.Mesh(new THREE.ConeGeometry(0.36, 0.22, 18), std(0xe6d8b4, { roughness: 0.9 }));
    hat.position.set(0, headY + 0.16, 0);
    hat.castShadow = true;
    g.add(hat);
    CY(g, 0.36, 0.36, 0.02, M.brass, 0, headY + 0.06, 0, 18, false);
  } else if (o.hat === 'cap') {
    CY(g, 0.15, 0.15, 0.07, std(0x2c3f57, { roughness: 0.9 }), 0, headY + 0.11, 0, 14, false);
    B(g, 0.26, 0.03, 0.18, std(0x2c3f57, { roughness: 0.9 }), 0, headY + 0.09, 0.15, 0, 0, 0, false);
  }
  if (o.scale) g.scale.setScalar(o.scale);
  return g;
}

const milkCoffeeM = std(0x8f5c33, { roughness: 0.4 });

function makeDrink(kind) {
  const g = new THREE.Group();
  const h = 0.25;
  CY(g, 0.072, 0.062, h, M.glassCup, 0, h / 2, 0, 12, false);
  const liquid = kind === 'den' ? M.coffee : kind === 'tra' ? M.tea : milkCoffeeM;
  CY(g, 0.064, 0.057, h * 0.82, liquid, 0, h * 0.41, 0, 12, false);
  for (let i = 0; i < 3; i++) {
    B(g, 0.05, 0.05, 0.05, M.ice, (R() - 0.5) * 0.07, h * 0.58 + R() * 0.08, (R() - 0.5) * 0.07, R(), R(), R(), false);
  }
  rod(g, [0.01, h * 0.5, 0], [0.075, h + 0.13, 0.03], 0.011, M.straw, 5);
  return g;
}

function makePhin() {
  const g = new THREE.Group();

  return g;
}

function makeMenuBoard() {
  const g = new THREE.Group();

  rod(g, [-0.47, 1.19, 0], [0.47, 1.19, 0], 0.03, M.woodDark, 6);

}

function makeHelmet(color) {
  const g = new THREE.Group();

  B(g, 0.06, 0.02, 0.34, std(0x222222), 0, 0.2, 0, 0, 0, 0, false);
  return g;
}

/* ============================================================

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}
window.addEventListener('resize', onResize);

const clock = new THREE.Clock();
function tick() {
  requestAnimationFrame(tick);
  updateAnims(clock.getElapsedTime());
  controls.update();
  renderer.render(scene, camera);
}
